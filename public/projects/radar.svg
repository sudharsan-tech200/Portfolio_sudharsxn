<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="r-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040714" />
      <stop offset="50%" stop-color="#080E24" />
      <stop offset="100%" stop-color="#050816" />
    </linearGradient>
    <radialGradient id="sweepGrad" cx="50%" cy="100%" r="100%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.45)" />
      <stop offset="50%" stop-color="rgba(56, 189, 248, 0.15)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#r-bg)" />
  
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Telemetry Header -->
  <rect x="30" y="20" width="740" height="42" rx="8" fill="rgba(14,20,46,0.75)" stroke="rgba(16,185,129,0.3)" stroke-width="1" />
  <circle cx="52" cy="41" r="5" fill="#10B981" filter="url(#glow)" />
  <text x="68" y="46" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#10B981">RADAR_TELEMETRY: 180° ANGULAR SCAN</text>
  <text x="520" y="46" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38BDF8">ECHO: 40kHz | RANGE: 2-400cm</text>

  <!-- Radar Scope Center at (400, 380) -->
  <g transform="translate(400, 380)">
    <path d="M -340 0 A 340 340 0 0 1 340 0" fill="none" stroke="rgba(16,185,129,0.22)" stroke-width="1.5" />
    <path d="M -260 0 A 260 260 0 0 1 260 0" fill="none" stroke="rgba(16,185,129,0.32)" stroke-width="1.5" />
    <path d="M -180 0 A 180 180 0 0 1 180 0" fill="none" stroke="rgba(16,185,129,0.42)" stroke-width="1.5" />
    <path d="M -100 0 A 100 100 0 0 1 100 0" fill="none" stroke="rgba(16,185,129,0.52)" stroke-width="1.5" />
    <line x1="-360" y1="0" x2="360" y2="0" stroke="rgba(16,185,129,0.6)" stroke-width="2" />

    <line x1="0" y1="0" x2="-240" y2="-240" stroke="rgba(16,185,129,0.25)" stroke-dasharray="4 4" />
    <line x1="0" y1="0" x2="0" y2="-340" stroke="rgba(16,185,129,0.4)" stroke-dasharray="4 4" />
    <line x1="0" y1="0" x2="240" y2="-240" stroke="rgba(16,185,129,0.25)" stroke-dasharray="4 4" />

    <text x="-355" y="-10" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">0°</text>
    <text x="-255" y="-248" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">45°</text>
    <text x="-10" y="-348" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#10B981">90°</text>
    <text x="240" y="-248" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">135°</text>
    <text x="340" y="-10" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">180°</text>

    <text x="-95" y="-105" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">20cm</text>
    <text x="-175" y="-185" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">40cm</text>
    <text x="-255" y="-265" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">60cm</text>

    <!-- Sweep Beam -->
    <path d="M 0 0 L -100 -325 A 340 340 0 0 1 90 -328 Z" fill="url(#sweepGrad)" />
    <line x1="0" y1="0" x2="90" y2="-328" stroke="#10B981" stroke-width="2.5" filter="url(#glow)" />

    <!-- Targets -->
    <circle cx="-130" cy="-130" r="6" fill="#EF4444" filter="url(#glow)" />
    <circle cx="-130" cy="-130" r="14" fill="none" stroke="#EF4444" stroke-width="1.2" opacity="0.7" />
    <text x="-230" y="-142" font-family="'JetBrains Mono', monospace" font-size="11" fill="#EF4444" font-weight="700">TARGET 1: 28cm @ 45°</text>

    <circle cx="170" cy="-190" r="6" fill="#FFA116" filter="url(#glow)" />
    <circle cx="170" cy="-190" r="14" fill="none" stroke="#FFA116" stroke-width="1.2" opacity="0.7" />
    <text x="185" y="-202" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFA116" font-weight="700">TARGET 2: 64cm @ 125°</text>

    <!-- Origin Sensor Hub -->
    <circle cx="0" cy="0" r="16" fill="#060A18" stroke="#10B981" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#10B981" />
  </g>

  <!-- Hardware Indicators -->
  <g transform="translate(30, 396)">
    <rect width="180" height="34" rx="8" fill="rgba(14,20,46,0.9)" stroke="rgba(56,189,248,0.35)" stroke-width="1" />
    <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#38BDF8">ARDUINO UNO + C++</text>
  </g>
  <g transform="translate(580, 396)">
    <rect width="190" height="34" rx="8" fill="rgba(14,20,46,0.9)" stroke="rgba(139,92,246,0.35)" stroke-width="1" />
    <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#A855F7">HC-SR04 + SG90 SERVO</text>
  </g>
</svg>