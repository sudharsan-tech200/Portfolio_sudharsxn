<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ig-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816" />
      <stop offset="50%" stop-color="#0A0F28" />
      <stop offset="100%" stop-color="#060919" />
    </linearGradient>
    <linearGradient id="ig-story" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="ig-brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#ig-bg)" />

  <!-- Instagram Phone/Feed Mockup Container -->
  <g transform="translate(190, 15)">
    <!-- Shell Frame -->
    <rect width="420" height="420" rx="20" fill="#0A0D1F" stroke="rgba(255,255,255,0.14)" stroke-width="1.5" />

    <!-- Top App Bar -->
    <rect width="420" height="52" rx="20" fill="#0F142D" />
    <!-- App Logo Text -->
    <text x="24" y="34" font-family="'Outfit', sans-serif" font-size="20" font-weight="800" fill="url(#ig-brand)" letter-spacing="-0.5">Instagram</text>
    <text x="130" y="32" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8" font-weight="700">[REACT CLONE]</text>
    
    <!-- Top Action Icons -->
    <g transform="translate(325, 20)">
      <!-- Heart Icon -->
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" transform="scale(0.8)" fill="none" stroke="#F8FAFC" stroke-width="1.8" />
      <!-- DM Plane Icon -->
      <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" transform="translate(32, 0) scale(0.75)" fill="none" stroke="#F8FAFC" stroke-width="1.8" />
    </g>

    <!-- Stories Tray -->
    <g transform="translate(16, 64)">
      <!-- Story 1 (Self) -->
      <circle cx="28" cy="24" r="23" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
      <circle cx="28" cy="24" r="20" fill="#1E293B" />
      <text x="28" y="28" font-family="'Outfit', sans-serif" font-size="12" fill="#F8FAFC" text-anchor="middle" font-weight="700">SS</text>
      <circle cx="44" cy="38" r="7" fill="#38BDF8" />
      <text x="44" y="41" font-size="10" fill="#000" text-anchor="middle" font-weight="900">+</text>
      <text x="28" y="58" font-family="'Outfit', sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Your story</text>

      <!-- Story 2 -->
      <circle cx="98" cy="24" r="23" fill="none" stroke="url(#ig-story)" stroke-width="2.2" />
      <circle cx="98" cy="24" r="19" fill="#3B82F6" />
      <text x="98" y="28" font-family="'Outfit', sans-serif" font-size="11" fill="#FFF" text-anchor="middle">alex.js</text>
      <text x="98" y="58" font-family="'Outfit', sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">alex_dev</text>

      <!-- Story 3 -->
      <circle cx="168" cy="24" r="23" fill="none" stroke="url(#ig-story)" stroke-width="2.2" />
      <circle cx="168" cy="24" r="19" fill="#8B5CF6" />
      <text x="168" y="28" font-family="'Outfit', sans-serif" font-size="11" fill="#FFF" text-anchor="middle">react</text>
      <text x="168" y="58" font-family="'Outfit', sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">react.daily</text>

      <!-- Story 4 -->
      <circle cx="238" cy="24" r="23" fill="none" stroke="url(#ig-story)" stroke-width="2.2" />
      <circle cx="238" cy="24" r="19" fill="#10B981" />
      <text x="238" y="28" font-family="'Outfit', sans-serif" font-size="11" fill="#FFF" text-anchor="middle">tech</text>
      <text x="238" y="58" font-family="'Outfit', sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">tech_feed</text>

      <!-- Story 5 -->
      <circle cx="308" cy="24" r="23" fill="none" stroke="url(#ig-story)" stroke-width="2.2" />
      <circle cx="308" cy="24" r="19" fill="#F59E0B" />
      <text x="308" y="28" font-family="'Outfit', sans-serif" font-size="11" fill="#FFF" text-anchor="middle">web</text>
      <text x="308" y="58" font-family="'Outfit', sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">frontend</text>
    </g>

    <!-- Main Feed Post -->
    <g transform="translate(14, 134)">
      <!-- Post Header -->
      <circle cx="16" cy="14" r="14" fill="url(#ig-story)" />
      <circle cx="16" cy="14" r="12" fill="#0A0D1F" />
      <text x="16" y="18" font-family="'Outfit', sans-serif" font-size="9" fill="#F8FAFC" text-anchor="middle" font-weight="700">SS</text>
      
      <text x="38" y="14" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">sudharsan_dev</text>
      <text x="38" y="24" font-family="'Outfit', sans-serif" font-size="9" fill="#64748B">Coimbatore, Tamil Nadu • Original Audio</text>

      <text x="375" y="16" font-size="14" fill="#94A3B8" font-weight="700">•••</text>

      <!-- Post Graphic Frame (Code Preview) -->
      <rect x="0" y="32" width="392" height="150" rx="10" fill="#060918" stroke="rgba(56,189,248,0.25)" stroke-width="1" />
      
      <!-- Code Card inside post -->
      <rect x="15" y="44" width="362" height="126" rx="8" fill="rgba(14,20,46,0.85)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <circle cx="32" cy="58" r="4" fill="#EF4444" />
      <circle cx="44" cy="58" r="4" fill="#F59E0B" />
      <circle cx="56" cy="58" r="4" fill="#10B981" />
      <text x="75" y="62" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">FeedCard.tsx (React Component)</text>

      <text x="30" y="86" font-family="'JetBrains Mono', monospace" font-size="11" fill="#A855F7">export default function <tspan fill="#38BDF8">FeedCard</tspan>() {</text>
      <text x="45" y="104" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F8FAFC">  const [likes, setLikes] = <tspan fill="#38BDF8">useState</tspan>(1420);</text>
      <text x="45" y="122" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F8FAFC">  const [isLiked, setIsLiked] = <tspan fill="#38BDF8">useState</tspan>(true);</text>
      <text x="45" y="140" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10B981">  return &lt;<tspan fill="#38BDF8">InteractiveFeedUI</tspan> reactive={true} /&gt;;</text>
      <text x="30" y="156" font-family="'JetBrains Mono', monospace" font-size="11" fill="#A855F7">}</text>

      <!-- Action Toolbar -->
      <g transform="translate(0, 192)">
        <!-- Liked Red Heart -->
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" transform="scale(0.85)" fill="#EF4444" />
        <!-- Comment Bubble -->
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" transform="translate(32, 0) scale(0.8)" fill="none" stroke="#F8FAFC" stroke-width="1.8" />
        <!-- Share Plane -->
        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" transform="translate(64, 0) scale(0.8)" fill="none" stroke="#F8FAFC" stroke-width="1.8" />
        <!-- Bookmark -->
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" transform="translate(370, 0) scale(0.8)" fill="none" stroke="#F8FAFC" stroke-width="1.8" />
      </g>

      <!-- Caption & Like Count -->
      <text x="0" y="222" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">1,421 likes</text>
      <text x="0" y="238" font-family="'Outfit', sans-serif" font-size="11" fill="#CBD5E1"><tspan font-weight="700">sudharsan_dev</tspan> Modular component hierarchy &amp; reactive props flow built from scratch in React.</text>
      <text x="0" y="254" font-family="'Outfit', sans-serif" font-size="10" fill="#64748B">View all 54 comments</text>
    </g>
  </g>
</svg>