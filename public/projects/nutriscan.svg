      <stop offset="0%" stop-color="#040816" />
      <stop offset="50%" stop-color="#09102E" />
      <stop offset="100%" stop-color="#05091C" />
    </linearGradient>
    <filter id="n-glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#n-bg)" />

  <!-- Top Telemetry Header -->
  <rect x="30" y="20" width="740" height="42" rx="8" fill="rgba(14,20,46,0.75)" stroke="rgba(16,185,129,0.35)" stroke-width="1" />
  <circle cx="52" cy="41" r="5" fill="#10B981" filter="url(#n-glow)" />
  <text x="68" y="46" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#10B981">NUTRISCAN: SMART LEGAL METROLOGY OCR INSPECTION</text>
