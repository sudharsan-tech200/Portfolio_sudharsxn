    <rect width="360" height="325" rx="14" fill="#0C132E" stroke="rgba(56,189,248,0.3)" stroke-width="1.5" />
    <rect x="20" y="20" width="320" height="285" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-dasharray="4 4" />
    
