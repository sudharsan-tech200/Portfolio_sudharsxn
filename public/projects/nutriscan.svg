        <text x="152" y="18" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#10B981" text-anchor="middle">OCR Model</text>
        <text x="152" y="30" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94A3B8" text-anchor="middle">Extraction</text>

