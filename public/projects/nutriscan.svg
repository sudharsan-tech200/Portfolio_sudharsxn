    <line x1="20" y1="170" x2="340" y2="170" stroke="#38BDF8" stroke-width="2.5" filter="url(#n-glow)" />

    <!-- Detection Box 1: MRP -->
    <rect x="40" y="105" width="280" height="36" rx="6" fill="rgba(16,185,129,0.15)" stroke="#10B981" stroke-width="1.5" />
    <text x="50" y="128" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF">MRP: ₹ 45.00 (INCL. OF ALL TAXES)</text>
    <text x="270" y="128" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#10B981">[VALID ✓]</text>

    <!-- Detection Box 2: MFG & EXP -->
    <rect x="40" y="152" width="280" height="36" rx="6" fill="rgba(56,189,248,0.15)" stroke="#38BDF8" stroke-width="1.5" />
    <text x="50" y="175" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF">MFG: 10/2026 · EXP: 04/2027</text>
    <text x="270" y="175" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38BDF8">[VALID ✓]</text>

    <!-- Detection Box 3: Net Quantity -->
    <rect x="40" y="198" width="280" height="36" rx="6" fill="rgba(139,92,246,0.15)" stroke="#A855F7" stroke-width="1.5" />
    <text x="50" y="221" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF">NET WT: 200g · BATCH: NX-402</text>
    <text x="270" y="221" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#A855F7">[VALID ✓]</text>

    <!-- Detection Box 4: Manufacturer / FSSAI -->
    <rect x="40" y="244" width="280" height="36" rx="6" fill="rgba(245,158,11,0.15)" stroke="#F59E0B" stroke-width="1.5" />
    <text x="50" y="267" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF">FSSAI LIC: 10019042000214</text>
    <text x="270" y="267" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#F59E0B">[VALID ✓]</text>
  </g>

