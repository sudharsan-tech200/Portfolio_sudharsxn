        <text x="42" y="18" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">OpenCV</text>
        <text x="42" y="30" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94A3B8" text-anchor="middle">Pre-Process</text>

        <text x="96" y="24" font-size="14" fill="#38BDF8">→</text>

